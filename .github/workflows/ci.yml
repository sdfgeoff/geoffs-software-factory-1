name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Check shared TypeScript protocol contract
        run: |
          npm run check:protocol --prefix frontend
          node --test scripts/generate-protocol-types.test.mjs
          npm run lint --prefix frontend
      - run: cargo build --locked
